  --accent: #0284C7;           /* blue accent */

  --base-100: #FFFFFF;         /* page background / cards */
  --base-150: #F8FAFC;         /* default app background */
  --base-200: #F1F5F9;         /* card / section background */
  --base-300: #E2E8F0;         /* borders, dividers */
  --base-content: #0F172A;     /* primary body text */
  --base-content-secondary: #64748B; /* secondary / muted text */

  --neutral: #171717;          /* dark backgrounds */
  --neutral-content: #E5E5E5;  /* text on dark */

  --success: #16A34A;
  --success-content: #DCFCE7;
  --warning: #F97316;
  --warning-content: #FFEDD5;
  --info: #9333EA;             /* info / purple */
  --info-content: #F3E8FF;

  /* ---- Brand gradient stops ---- */
  --brand-coral: #F65B66;
  --brand-fuchsia: #C026D3;
  --brand-blue: #1E40AF;
  /* Membership gradient — the ONLY gradient in the system */
  --membership-gradient: linear-gradient(124deg, #F65B66 0%, #C026D3 49.2%, #1E40AF 98.4%); /* @kind color */

  /* ---- Interactive detail ---- */
  --focus-ring: #06B6D4;       /* cyan — inputs, selection, active tabs only */

  /* ---- Tier 2 · Primitives (icons / illustrations / edge cases) ---- */
  --neutral-50: #FAFAFA;
  --neutral-100: #F5F5F5;
  --neutral-200: #E5E5E5;
  --neutral-300: #D4D4D4;
  --neutral-400: #A3A3A3;
  --neutral-500: #737373;
  --neutral-700: #404040;
  --neutral-900: #171717;

  --slate-50: #F8FAFC;
  --slate-100: #F1F5F9;
  --slate-200: #E2E8F0;
  --slate-400: #94A3B8;
  --slate-500: #64748B;
  --slate-900: #0F172A;

  --cyan-50: #ECFEFF;          /* selection-card selected bg */
  --cyan-500: #06B6D4;
  --sky-500: #0EA5E9;
  --red-500: #EF4444;          /* input error border */

  /* ---- Semantic aliases used across the system ---- */
  --text-primary: var(--base-content);
  --text-muted: var(--base-content-secondary);
  --text-on-dark: var(--neutral-content);
  --surface-page: var(--base-150);
  --surface-card: var(--base-100);
  --surface-sunken: var(--base-200);
  --border-default: var(--neutral-200);   /* #E5E5E5 control border */
  --border-subtle: var(--neutral-100);    /* #F5F5F5 card hairline */
  --border-hover: var(--slate-400);       /* #94A3B8 */
  --link: var(--secondary);
}
</style>
<style>/* ============================================================
   DLAI TYPOGRAPHY
   Headlines → Poppins SemiBold. Everything else → Inter.
   Never use Poppins for body, labels, or UI text.
   ============================================================ */
:root {
  --font-headline: 'Poppins', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;

  /* Weights */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ---- Headline scale (Poppins, desktop) ---- */
  --headline1-size: 48px;  --headline1-lh: 52px;
  --headline2-size: 36px;  --headline2-lh: 44px;
  --headline3-size: 30px;  --headline3-lh: 36px;
  --headline4-size: 26px;  --headline4-lh: 32px;
  --headline5-size: 24px;  --headline5-lh: 28px;

  /* Mobile headline overrides */
  --headline1-size-mobile: 40px;
  --headline2-size-mobile: 32px;
  --headline3-size-mobile: 28px;
  --headline4-size-mobile: 24px;
  --headline5-size-mobile: 22px;

  /* ---- Subtitles (Inter SemiBold) ---- */
  --subtitle1-size: 20px;  --subtitle1-lh: 24px;  --subtitle1-ls: 0; /* @kind font */
  --subtitle2-size: 16px;  --subtitle2-lh: 24px;  --subtitle2-ls: 0.5px;
  --subtitle3-size: 14px;  --subtitle3-lh: 20px;  --subtitle3-ls: 0.1px;

  /* ---- Body (Inter Regular) ---- */
  --body1-size: 16px;  --body1-lh: 24px;  --body1-ls: 0.5px;
  --body2-size: 14px;  --body2-lh: 20px;  --body2-ls: 0.25px;
  --body3-size: 12px;  --body3-lh: 16px;  --body3-ls: 0.1px;

  /* ---- Labels (Inter Medium) ---- */
  --label1-size: 14px;  --label1-lh: 20px;  --label1-ls: 0.1px;
  --label2-size: 12px;  --label2-lh: 16px;  --label2-ls: 0.1px;
}

/* ---- Optional utility classes (mirror the tokens) ---- */
.dlai-headline1 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline1-size); line-height: var(--headline1-lh); color: var(--base-content); }
.dlai-headline2 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline2-size); line-height: var(--headline2-lh); color: var(--base-content); }
.dlai-headline3 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline3-size); line-height: var(--headline3-lh); color: var(--base-content); }
.dlai-headline4 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline4-size); line-height: var(--headline4-lh); color: var(--base-content); }
.dlai-headline5 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline5-size); line-height: var(--headline5-lh); color: var(--base-content); }
.dlai-subtitle1 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle1-size); line-height: var(--subtitle1-lh); }
.dlai-subtitle2 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle2-size); line-height: var(--subtitle2-lh); letter-spacing: var(--subtitle2-ls); }
.dlai-subtitle3 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle3-size); line-height: var(--subtitle3-lh); letter-spacing: var(--subtitle3-ls); }
.dlai-body1 { font-family: var(--font-body); font-weight: 400; font-size: var(--body1-size); line-height: var(--body1-lh); letter-spacing: var(--body1-ls); color: var(--base-content); }
.dlai-body2 { font-family: var(--font-body); font-weight: 400; font-size: var(--body2-size); line-height: var(--body2-lh); letter-spacing: var(--body2-ls); }
.dlai-body3 { font-family: var(--font-body); font-weight: 400; font-size: var(--body3-size); line-height: var(--body3-lh); letter-spacing: var(--body3-ls); }
.dlai-label1 { font-family: var(--font-body); font-weight: 500; font-size: var(--label1-size); line-height: var(--label1-lh); letter-spacing: var(--label1-ls); }
.dlai-label2 { font-family: var(--font-body); font-weight: 500; font-size: var(--label2-size); line-height: var(--label2-lh); letter-spacing: var(--label2-ls); }
</style>
<style>/* ============================================================
   DLAI SPACING — 4-point grid.
   Most common steps: 4 / 8 / 12 / 16 / 24 / 32px.
   ============================================================ */
:root {
  --space-1: 4px;    /* icon-text gaps, button padding */
  --space-2: 8px;    /* chip spacing, icon buttons */
  --space-3: 12px;   /* between small cards/buttons */
  --space-4: 16px;   /* medium card padding */
  --space-6: 24px;   /* section / modal / card padding */
  --space-8: 32px;   /* largest UI pieces */
  --space-10: 40px;  /* between sections */

  /* Layout containers */
  --container-xl: 1128px;   /* desktop max content width */
  --container-2xl: 1504px;  /* wide max content width */
  --gutter-desktop: 24px;
  --margin-page: 32px;
}
</style>
<style>/* ============================================================
   DLAI EFFECTS — radius, shadows, motion.
   Cards use shadow as the primary depth signal (not borders).
   ============================================================ */
:root {
  /* ---- Border radius ---- */
  --radius-sm: 4px;     /* tags, text fields, small components */
  --radius-lg: 8px;     /* cards, buttons */
  --radius-icon: 20px;  /* icon containers, badges */
  --radius-full: 9999px;/* chips, icon buttons, capsules */

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);                          /* cards (default) */
  --shadow: 0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06); /* cards (hover) */
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.06); /* toast */
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -4px rgba(0,0,0,0.05); /* modals, dropdowns */

  /* ---- Focus ring (cyan — inputs / selection / active tabs only) ---- */
  --focus-shadow: 0 0 0 1px #fff, 0 0 0 2px var(--focus-ring);

  /* ---- Motion — minimal and purposeful ---- */
  --transition: 150ms ease-in-out; /* @kind other */
}
</style>

   Never hardcode hex — reference these custom properties.
   ============================================================ */

  /* ---- Tier 1 · Semantic ---- */
  --primary: #F65B66;          /* main CTA, brand coral red */
  --primary-hover: #DB515B;    /* primary button hover */
  --primary-content: #FEF2F2;  /* text on red */

  --secondary: #0891B2;        /* teal — secondary actions, links, ghost */
  --secondary-content: #CFFAFE;

  --accent: #0284C7;           /* blue accent */
  --accent-content: #E0F2FE;

  --base-100: #FFFFFF;         /* page background / cards */
  --base-150: #F8FAFC;         /* default app background */
  --base-200: #F1F5F9;         /* card / section background */
  --base-300: #E2E8F0;         /* borders, dividers */
  --base-content: #0F172A;     /* primary body text */
  --base-content-secondary: #64748B; /* secondary / muted text */

  --neutral: #171717;          /* dark backgrounds */
  --neutral-content: #E5E5E5;  /* text on dark */

  --success: #16A34A;
  --success-content: #DCFCE7;
  --warning: #F97316;
  --warning-content: #FFEDD5;
  --info: #9333EA;             /* info / purple */
  --info-content: #F3E8FF;

  /* ---- Brand gradient stops ---- */
  --brand-coral: #F65B66;
  --brand-fuchsia: #C026D3;
  --brand-blue: #1E40AF;
  /* Membership gradient — the ONLY gradient in the system */
  --membership-gradient: linear-gradient(124deg, #F65B66 0%, #C026D3 49.2%, #1E40AF 98.4%); /* @kind color */

  /* ---- Interactive detail ---- */
  --focus-ring: #06B6D4;       /* cyan — inputs, selection, active tabs only */

  /* ---- Tier 2 · Primitives (icons / illustrations / edge cases) ---- */
  --neutral-50: #FAFAFA;
  --neutral-100: #F5F5F5;
  --neutral-200: #E5E5E5;
  --neutral-300: #D4D4D4;
  --neutral-400: #A3A3A3;
  --neutral-500: #737373;
  --neutral-700: #404040;
  --neutral-900: #171717;

  --slate-50: #F8FAFC;
  --slate-100: #F1F5F9;
  --slate-200: #E2E8F0;
  --slate-400: #94A3B8;
  --slate-500: #64748B;
  --slate-900: #0F172A;

  --cyan-50: #ECFEFF;          /* selection-card selected bg */
  --cyan-500: #06B6D4;
  --sky-500: #0EA5E9;
  --red-500: #EF4444;          /* input error border */

  /* ---- Semantic aliases used across the system ---- */
  --text-primary: var(--base-content);
  --text-muted: var(--base-content-secondary);
  --text-on-dark: var(--neutral-content);
  --surface-page: var(--base-150);
  --surface-card: var(--base-100);
  --surface-sunken: var(--base-200);
  --border-default: var(--neutral-200);   /* #E5E5E5 control border */
  --border-subtle: var(--neutral-100);    /* #F5F5F5 card hairline */
  --border-hover: var(--slate-400);       /* #94A3B8 */
  --link: var(--secondary);
}

/* ============================================================
   DLAI TYPOGRAPHY
   Headlines → Poppins SemiBold. Everything else → Inter.
   Never use Poppins for body, labels, or UI text.
   ============================================================ */
:root {
  --font-headline: 'Poppins', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;

  /* Weights */
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  /* ---- Headline scale (Poppins, desktop) ---- */
  --headline1-size: 48px;  --headline1-lh: 52px;
  --headline2-size: 36px;  --headline2-lh: 44px;
  --headline3-size: 30px;  --headline3-lh: 36px;
  --headline4-size: 26px;  --headline4-lh: 32px;
  --headline5-size: 24px;  --headline5-lh: 28px;

  /* Mobile headline overrides */
  --headline1-size-mobile: 40px;
  --headline2-size-mobile: 32px;
  --headline3-size-mobile: 28px;
  --headline4-size-mobile: 24px;
  --headline5-size-mobile: 22px;

  /* ---- Subtitles (Inter SemiBold) ---- */
  --subtitle1-size: 20px;  --subtitle1-lh: 24px;  --subtitle1-ls: 0; /* @kind font */
  --subtitle2-size: 16px;  --subtitle2-lh: 24px;  --subtitle2-ls: 0.5px;
  --subtitle3-size: 14px;  --subtitle3-lh: 20px;  --subtitle3-ls: 0.1px;

  /* ---- Body (Inter Regular) ---- */
  --body1-size: 16px;  --body1-lh: 24px;  --body1-ls: 0.5px;
  --body2-size: 14px;  --body2-lh: 20px;  --body2-ls: 0.25px;
  --body3-size: 12px;  --body3-lh: 16px;  --body3-ls: 0.1px;

  /* ---- Labels (Inter Medium) ---- */
  --label1-size: 14px;  --label1-lh: 20px;  --label1-ls: 0.1px;
  --label2-size: 12px;  --label2-lh: 16px;  --label2-ls: 0.1px;
}

/* ---- Optional utility classes (mirror the tokens) ---- */
.dlai-headline1 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline1-size); line-height: var(--headline1-lh); color: var(--base-content); }
.dlai-headline2 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline2-size); line-height: var(--headline2-lh); color: var(--base-content); }
.dlai-headline3 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline3-size); line-height: var(--headline3-lh); color: var(--base-content); }
.dlai-headline4 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline4-size); line-height: var(--headline4-lh); color: var(--base-content); }
.dlai-headline5 { font-family: var(--font-headline); font-weight: 600; font-size: var(--headline5-size); line-height: var(--headline5-lh); color: var(--base-content); }
.dlai-subtitle1 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle1-size); line-height: var(--subtitle1-lh); }
.dlai-subtitle2 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle2-size); line-height: var(--subtitle2-lh); letter-spacing: var(--subtitle2-ls); }
.dlai-subtitle3 { font-family: var(--font-body); font-weight: 600; font-size: var(--subtitle3-size); line-height: var(--subtitle3-lh); letter-spacing: var(--subtitle3-ls); }
.dlai-body1 { font-family: var(--font-body); font-weight: 400; font-size: var(--body1-size); line-height: var(--body1-lh); letter-spacing: var(--body1-ls); color: var(--base-content); }
.dlai-body2 { font-family: var(--font-body); font-weight: 400; font-size: var(--body2-size); line-height: var(--body2-lh); letter-spacing: var(--body2-ls); }
.dlai-body3 { font-family: var(--font-body); font-weight: 400; font-size: var(--body3-size); line-height: var(--body3-lh); letter-spacing: var(--body3-ls); }
.dlai-label1 { font-family: var(--font-body); font-weight: 500; font-size: var(--label1-size); line-height: var(--label1-lh); letter-spacing: var(--label1-ls); }
.dlai-label2 { font-family: var(--font-body); font-weight: 500; font-size: var(--label2-size); line-height: var(--label2-lh); letter-spacing: var(--label2-ls); }

/* ============================================================
   DLAI SPACING — 4-point grid.
   Most common steps: 4 / 8 / 12 / 16 / 24 / 32px.
   ============================================================ */
:root {
  --space-1: 4px;    /* icon-text gaps, button padding */
  --space-2: 8px;    /* chip spacing, icon buttons */
  --space-3: 12px;   /* between small cards/buttons */
  --space-4: 16px;   /* medium card padding */
  --space-6: 24px;   /* section / modal / card padding */
  --space-8: 32px;   /* largest UI pieces */
  --space-10: 40px;  /* between sections */

  /* Layout containers */
  --container-xl: 1128px;   /* desktop max content width */
  --container-2xl: 1504px;  /* wide max content width */
  --gutter-desktop: 24px;
  --margin-page: 32px;
}

/* ============================================================
   DLAI EFFECTS — radius, shadows, motion.
   Cards use shadow as the primary depth signal (not borders).
   ============================================================ */
:root {
  /* ---- Border radius ---- */
  --radius-sm: 4px;     /* tags, text fields, small components */
  --radius-lg: 8px;     /* cards, buttons */
  --radius-icon: 20px;  /* icon containers, badges */
  --radius-full: 9999px;/* chips, icon buttons, capsules */

  /* ---- Shadows ---- */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);                          /* cards (default) */
  --shadow: 0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06); /* cards (hover) */
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.10), 0 2px 4px -2px rgba(0,0,0,0.06); /* toast */
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.10), 0 4px 6px -4px rgba(0,0,0,0.05); /* modals, dropdowns */

  /* ---- Focus ring (cyan — inputs / selection / active tabs only) ---- */
  --focus-shadow: 0 0 0 1px #fff, 0 0 0 2px var(--focus-ring);

  /* ---- Motion — minimal and purposeful ---- */
  --transition: 150ms ease-in-out; /* @kind other */
}

<script>
/* Data for the M2 "Coverage Map" dashboard — grounded in the Chroma embeddings-visualizer
   notebook (uploads/visualizations.ipynb): a customer-support message set, UMAP-projected,
   clustered by topic. Some topics are well covered (big, tight clusters); some barely exist.
   A query lands somewhere in this space — retrieval is only as good as what's nearby.
   Sets window.M2_MAP. REF space 840x400, sized to match a wide landscape card. */
(function () {
  var REF = { w: 840, h: 400 };

  function makeRng(seed) {
    var s = seed >>> 0;
    return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0x100000000; };
  }
  function makeCluster(cx, cy, n, sx, sy, angle, seed, maxSigma) {
    maxSigma = maxSigma || 2.0;
    var rng = makeRng(seed), pts = [];
    while (pts.length < n) {
      var u1 = Math.max(rng(), 1e-10), u2 = rng();
      var z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      var z1 = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);
      if (Math.hypot(z0, z1) > maxSigma) continue;
      var lx = z0 * sx, ly = z1 * sy, ca = Math.cos(angle), sa = Math.sin(angle);
      pts.push({ x: cx + ca * lx - sa * ly, y: cy + sa * lx + ca * ly });
    }
    return pts;
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  var DEFS = [
    { id: 'upgrade', label: 'Upgrade Issues', color: '#0891B2', n: 17, cx: 690, cy: 115, sx: 66, sy: 32, ang: -0.3, seed: 11,
      chunks: ['plan-upgrade.md · Free \u2192 Pro, step by step', 'billing.service.ts · prorateUpgrade()', 'seats.md · adding seats to a Team plan', 'upgrade-faq.md · rolling back after upgrading', 'team-pro.md · what changes on Team Pro'] },
    { id: 'app', label: 'App Issues', color: '#64748B', n: 16, cx: 150, cy: 105, sx: 70, sy: 40, ang: 0.4, seed: 22,
      chunks: ['mobile-crash.md · crash after the v4.2 update', 'sync.service.ts · resolving offline conflicts', 'android-142.md · widget stops refreshing', 'ios-88.md · app freezes on launch', 'app-issues.md · known bugs this release'] },
    { id: 'api', label: 'API Integration', color: '#F97316', n: 11, cx: 430, cy: 80, sx: 40, sy: 22, ang: 0.2, seed: 33,
      chunks: ['api-v3-migration.md · moving off v2 endpoints', 'oauth-refresh.md · rotating access tokens', 'webhooks.md · retry behavior on failure', 'rate-limits.md · v3 request quotas', 'jira-integration.md · webhook setup'] },
    { id: 'feature', label: 'Feature Requests', color: '#6366F1', n: 11, cx: 565, cy: 225, sx: 38, sy: 24, ang: -0.2, seed: 44,
      chunks: ['roadmap.md · most requested this quarter', 'dark-mode.md · tracking the request', 'beta-program.md · opting into early features', 'changelog.md · shipped last sprint', 'feature-votes.md · how we prioritize'] },
    { id: 'password', label: 'Password Reset', color: '#9333EA', n: 12, cx: 245, cy: 305, sx: 42, sy: 24, ang: 0.15, seed: 55,
      chunks: ['password-reset.md · troubleshooting the email link', 'auth.service.ts · resetPassword()', 'sso-lockout.md · locked out after an SSO change', 'reset-link.md · link expired, what to do', '2fa-recovery.md · lost authenticator access'] },
    { id: 'privacy', label: 'Privacy Settings', color: '#DB2777', n: 8, cx: 395, cy: 190, sx: 26, sy: 18, ang: 0.1, seed: 66,
      chunks: ['privacy-controls.md · who can see your workspace', 'visibility.service.ts · setWorkspaceVisibility()', 'data-sharing.md · third-party sharing toggle', 'privacy-faq.md · what we never share'] },
    { id: 'recovery', label: 'Data Recovery', color: '#16A34A', n: 7, cx: 120, cy: 325, sx: 26, sy: 18, ang: -0.1, seed: 77,
      chunks: ['data-recovery.md · restoring a deleted board', 'backups.service.ts · restoreSnapshot()', 'trash.md · the 30-day recovery window', 'export-before-delete.md · safety export'] },
    { id: 'cancel', label: 'Subscription Cancellation', color: '#06B6D4', n: 8, cx: 735, cy: 330, sx: 22, sy: 15, ang: 0.2, seed: 88,
      chunks: ['cancel-subscription.md · step-by-step', 'billing.service.ts · cancelPlan()', 'retention-offer.md · pause instead of cancel', 'refund-policy.md · prorated refunds'] }
  ];

  function buildMap() {
    var clusters = DEFS.map(function (c) {
      var pts = makeCluster(c.cx, c.cy, c.n, c.sx, c.sy, c.ang, c.seed);
      pts.forEach(function (p, i) { p.cid = c.id; p.chunk = c.chunks[i % c.chunks.length]; });
      return { id: c.id, label: c.label, color: c.color, cx: c.cx, cy: c.cy, points: pts };
    });
    var all = [];
    clusters.forEach(function (c) { all = all.concat(c.points); });
    var byId = {}; clusters.forEach(function (c) { byId[c.id] = c; });
    return { clusters: clusters, all: all, byId: byId };
  }

  // k-nearest points to a query, k=5 (matches the notebook's n_results=5).
  function topK(map, q, k) {
    k = k || 5;
    return map.all.map(function (p) { return { p: p, d: dist(q, p) }; })
      .sort(function (a, b) { return a.d - b.d; }).slice(0, k);
  }

  // Verdict from nearest-neighbor distance: is there anything close at all?
  function verdict(nearestD) {
    if (nearestD < 30) return 'tight';
    if (nearestD < 60) return 'scattered';
    return 'gap';
  }

  var PRESETS = [
    { label: 'Cancel my subscription', q: 'How do I cancel my subscription before it renews?', x: 735, y: 325 },
    { label: 'I need help with something', q: 'I need help with something.', x: 550, y: 155 },
    { label: 'GDPR compliance?', q: 'Is your platform GDPR compliant?', x: 540, y: 130 }
  ];

  window.M2_MAP = { REF: REF, dist: dist, buildMap: buildMap, topK: topK, verdict: verdict, PRESETS: PRESETS };
})();

</script>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:450}}">
class Component extends DCLogic {
  state = { query: null, queryText: null };
  wrapRef = React.createRef();
  canvasRef = React.createRef();
  S = 1;

  get G() { return window.M2_MAP; }

  componentDidMount() {
    if (!this.G) { this._dt = setInterval(() => { if (this.G) { clearInterval(this._dt); this.init(); this.forceUpdate(); } }, 60); return; }
    this.init();
  }
  init() { this.map = this.G.buildMap(); this.setup(); this.draw(); }
  componentWillUnmount() { if (this._dt) clearInterval(this._dt); if (this._ro) this._ro.disconnect(); }
  componentDidUpdate() { this.draw(); }

  setup() {
    const cv = this.canvasRef.current, wrap = this.wrapRef.current;
    if (!cv || !wrap) return;
    this._ro = new ResizeObserver(() => { this.resize(); this.draw(); });
    this._ro.observe(wrap);
    this.resize();
    const getRef = (e) => { const r = cv.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: (s.clientX - r.left) / this.S, y: (s.clientY - r.top) / this.S }; };
    let drag = false;
    const set = (e) => this.setState({ query: getRef(e), queryText: null });
    cv.addEventListener('mousedown', (e) => { drag = true; set(e); });
    cv.addEventListener('mousemove', (e) => { if (drag) set(e); });
    window.addEventListener('mouseup', () => { drag = false; });
    cv.addEventListener('touchstart', (e) => { e.preventDefault(); drag = true; set(e); }, { passive: false });
    cv.addEventListener('touchmove', (e) => { e.preventDefault(); if (drag) set(e); }, { passive: false });
    cv.addEventListener('touchend', () => { drag = false; });
    cv.addEventListener('keydown', (e) => {
      const q = this.state.query || { x: this.G.REF.w / 2, y: this.G.REF.h / 2 };
      const step = e.shiftKey ? 24 : 8; let nx = q.x, ny = q.y, hit = true;
      if (e.key === 'ArrowLeft') nx -= step; else if (e.key === 'ArrowRight') nx += step;
      else if (e.key === 'ArrowUp') ny -= step; else if (e.key === 'ArrowDown') ny += step; else hit = false;
      if (hit) { e.preventDefault(); this.setState({ query: { x: Math.max(0, Math.min(this.G.REF.w, nx)), y: Math.max(0, Math.min(this.G.REF.h, ny)) }, queryText: null }); }
    });
  }

  resize() {
    const cv = this.canvasRef.current, wrap = this.wrapRef.current;
    if (!cv || !wrap) return;
    const REF = this.G.REF, aw = wrap.clientWidth - 12, ah = wrap.clientHeight - 12;
    const s = Math.max(0.1, Math.min(aw / REF.w, ah / REF.h)); this.S = s;
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = (REF.w * s) + 'px'; cv.style.height = (REF.h * s) + 'px';
    cv.width = Math.round(REF.w * s * dpr); cv.height = Math.round(REF.h * s * dpr);
    cv.getContext('2d').setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  }

  result() {
    if (!this.state.query || !this.map) return null;
    const G = this.G, q = this.state.query;
    const top = G.topK(this.map, q, 5);
    const nearestD = Math.round(top[0].d);
    const v = G.verdict(top[0].d);
    const uniqIds = [...new Set(top.map(t => t.p.cid))];
    return { top, nearestD, v, uniqLabels: uniqIds.map(id => this.map.byId[id].label) };
  }

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  draw() {
    const cv = this.canvasRef.current; if (!cv || !this.map) return;
    const ctx = cv.getContext('2d'), G = this.G, REF = G.REF;
    ctx.clearRect(0, 0, REF.w, REF.h); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, REF.w, REF.h);
    ctx.strokeStyle = '#F1F5F9'; ctx.lineWidth = 1;
    for (let x = 0; x <= REF.w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, REF.h); ctx.stroke(); }
    for (let y = 0; y <= REF.h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(REF.w, y); ctx.stroke(); }

    const res = this.result();
    const topSet = res ? new Set(res.top.map(t => t.p)) : null;
    const dim = res ? 0.30 : 1;

    // dots
    this.map.clusters.forEach(cl => {
      cl.points.forEach(p => {
        if (topSet && topSet.has(p)) return;
        ctx.globalAlpha = dim; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 6.2832); ctx.fillStyle = cl.color; ctx.fill(); ctx.globalAlpha = 1;
      });
    });

    // labels (always visible, small pill)
    ctx.font = '600 11px Inter, sans-serif'; ctx.textBaseline = 'middle';
    this.map.clusters.forEach(cl => {
      const label = cl.label, tw = ctx.measureText(label).width;
      const lx = cl.cx, ly = cl.cy - (Math.max(...cl.points.map(p => cl.cy - p.y)) + 16);
      const active = !res || (res && res.top.some(t => t.p.cid === cl.id));
      ctx.globalAlpha = active ? 0.96 : 0.55;
      this.roundRect(ctx, lx - tw / 2 - 6, ly - 9, tw + 12, 18, 5);
      ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = cl.color; ctx.stroke();
      ctx.fillStyle = '#0F172A'; ctx.textAlign = 'center'; ctx.fillText(label, lx, ly + 1);
      ctx.globalAlpha = 1;
    });

    if (res) {
      const q = this.state.query;
      // gap ring
      if (res.v === 'gap') {
        ctx.beginPath(); ctx.arc(q.x, q.y, 46, 0, 6.2832);
        ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.strokeStyle = '#F65B66'; ctx.stroke(); ctx.setLineDash([]);
      }
      // connecting lines
      res.top.forEach((t, i) => {
        ctx.globalAlpha = Math.max(0.35, 1 - i * 0.12);
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(t.p.x, t.p.y);
        ctx.strokeStyle = this.map.byId[t.p.cid].color; ctx.lineWidth = 2; ctx.stroke();
      });
      ctx.globalAlpha = 1;
      // highlighted retrieved points
      res.top.forEach((t, i) => {
        ctx.beginPath(); ctx.arc(t.p.x, t.p.y, 7.5, 0, 6.2832);
        ctx.fillStyle = this.map.byId[t.p.cid].color; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#0F172A'; ctx.stroke();
      });
      // query marker
      ctx.beginPath(); ctx.arc(q.x, q.y, 9, 0, 6.2832); ctx.fillStyle = '#F65B66'; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#fff'; ctx.stroke();
    }
  }

  preset(p) { this.setState({ query: { x: p.x, y: p.y }, queryText: p.q }); }
  reset() { this.setState({ query: null, queryText: null }); }

  renderVals() {
    const h = React.createElement;
    const G = this.G;
    const res = this.result();

    const presetEl = (G ? G.PRESETS : []).map((p, i) => {
      const active = this.state.queryText === p.q;
      return h('button', { key: i, className: 'm2cm-btn', onClick: () => this.preset(p),
        style: { height: '38px', padding: '0 12px', fontFamily: 'var(--font-body)', fontWeight: 600, fontSize: '12.5px', borderRadius: 'var(--radius-lg)', cursor: 'pointer', transition: 'var(--transition)',
          border: '1px solid ' + (active ? 'var(--focus-ring)' : 'var(--border-default)'), background: active ? 'var(--cyan-50)' : 'var(--base-100)', color: 'var(--base-content)', whiteSpace: 'nowrap' } }, p.label);
    });

    const VMETA = {
      tight: { label: 'Tight match', color: 'var(--success)', bg: 'var(--success-content)', icon: 'ri-checkbox-circle-fill' },
      scattered: { label: 'Scattered signal', color: '#C2410C', bg: 'var(--warning-content)', icon: 'ri-error-warning-fill' },
      gap: { label: 'Coverage gap', color: 'var(--primary-hover)', bg: '#FEE9EA', icon: 'ri-close-circle-fill' },
    };

    let panelEl;
    if (!res) {
      panelEl = h('div', { style: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: '12px', background: 'var(--base-100)', border: '1px dashed var(--base-300)', borderRadius: 'var(--radius-lg)', padding: '18px' } },
        h('div', { style: { width: '36px', height: '36px', borderRadius: 'var(--radius-icon)', background: 'var(--cyan-50)', display: 'flex', alignItems: 'center', justifyContent: 'center' } }, h('i', { className: 'ri-map-pin-line', style: { fontSize: '19px', color: 'var(--accent)' } })),
        h('p', { style: { fontSize: '13.5px', fontWeight: 600, lineHeight: 1.45, color: 'var(--base-content)', margin: 0 } }, 'Click the map, or try a real question below.'),
        h('p', { style: { fontSize: '12px', lineHeight: 1.5, color: 'var(--base-content-secondary)', margin: 0 } }, 'Retrieval works when the corpus covers the topic. Some questions land inside a cluster. Others land in empty space.')
      );
    } else {
      const vm = VMETA[res.v];
      panelEl = h('div', { style: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', gap: '9px', background: 'var(--base-100)', border: '1px solid var(--base-300)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', padding: '12px 13px' } },
        this.state.queryText ? h('div', { style: { fontSize: '12px', fontStyle: 'italic', color: 'var(--base-content-secondary)', lineHeight: 1.4 } }, '\u201c' + this.state.queryText + '\u201d') : null,
        h('div', { style: { display: 'flex', alignItems: 'center', gap: '6px' } },
          h('i', { className: vm.icon, style: { fontSize: '15px', color: vm.color } }),
          h('span', { style: { fontFamily: 'var(--font-headline)', fontWeight: 600, fontSize: '15px', color: 'var(--base-content)' } }, vm.label),
          h('span', { style: { marginLeft: 'auto', fontFamily: "'JetBrains Mono',monospace", fontSize: '10.5px', fontWeight: 600, color: 'var(--base-content-secondary)' } }, 'nearest ' + res.nearestD)
        ),
        h('div', { style: { fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px', color: 'var(--base-content-secondary)', marginTop: '2px' } }, '5 nearest messages'),
        h('div', { className: 'm2cm-scroll', style: { flex: 1, minHeight: 0, overflowY: 'auto', overflowX: 'hidden', display: 'flex', flexDirection: 'column', gap: '5px' } },
          res.top.map((t, i) => {
            const cl = this.map.byId[t.p.cid];
            return h('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: '7px', background: 'var(--base-150)', borderRadius: 'var(--radius-sm)', padding: '5px 8px' } },
              h('span', { style: { width: '7px', height: '7px', borderRadius: '50%', flexShrink: 0, background: cl.color } }),
              h('span', { style: { flex: 1, minWidth: 0, fontFamily: "'JetBrains Mono',monospace", fontSize: '10px', lineHeight: 1.3, color: 'var(--base-content)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, t.p.chunk),
              h('span', { style: { fontSize: '9.5px', fontWeight: 600, color: 'var(--base-content-secondary)', flexShrink: 0, maxWidth: '76px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', textAlign: 'right' } }, cl.label)
            );
          })
        )
      );
    }

    let calloutTag = null, calloutBg = 'var(--cyan-50)', calloutFg = 'var(--accent)', calloutText;
    if (!res) calloutText = 'Similar meanings sit near each other. Ask a question and watch where it lands.';
    else if (res.v === 'tight') calloutText = 'All five nearest messages share one topic: ' + res.uniqLabels[0] + '. One clear match — retrieval can answer this with confidence.';
    else if (res.v === 'scattered') { calloutTag = 'Watch'; calloutBg = 'var(--warning-content)'; calloutFg = '#C2410C'; calloutText = 'The nearest messages span ' + res.uniqLabels.length + ' different topics (' + res.uniqLabels.join(', ') + '). A vague question returns a vague set of matches.'; }
    else { calloutTag = 'Gap'; calloutBg = '#FEE9EA'; calloutFg = 'var(--primary-hover)'; calloutText = 'Nothing sits within reach — the nearest message is still ' + res.nearestD + ' units away. The corpus has no coverage for this topic.'; }

    return {
      wrapRef: this.wrapRef, canvasRef: this.canvasRef,
      presetEl, panelEl,
      canvasAria: res ? ('Question landed: ' + res.v) : 'A map of support messages grouped into topic clusters, with empty space between them. Click or tap to drop a question.',
      onReset: () => this.reset(),
      calloutTag, calloutTagBg: calloutBg, calloutTagFg: calloutFg, calloutText,
      hasCalloutTag: !!calloutTag,
    };
  }
}
</script>

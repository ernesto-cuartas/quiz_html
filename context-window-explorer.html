.hd h1{font-family:var(--font-headline);font-weight:600;font-size:26px;line-height:32px;letter-spacing:-.01em}
.devbadge{display:inline-block;vertical-align:4px;margin-left:12px;font:700 11px/16px var(--mono);background:#0F172A;color:#F8FAFC;border-radius:6px;padding:3px 8px;letter-spacing:.06em}
.pills{display:flex;gap:8px;flex:none}
.pill{white-space:nowrap;font:500 14px/20px var(--font-body);padding:9px 20px;border-radius:999px;border:1px solid var(--base-300);background:var(--base-100);color:var(--ink);cursor:pointer}
.pill:hover{border-color:var(--slate-400)}
.pill.on{background:var(--primary);border-color:var(--primary);color:#fff}
.lbl{font:600 12px/16px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:#475569}
.meter{margin-top:20px}
.meter-hd{display:flex;align-items:baseline;justify-content:space-between}
.meter-num{font-family:var(--mono);font-size:15px;color:var(--muted)}
.meter-num b{font-size:18px;color:var(--ink);font-weight:700}
.track-wrap{position:relative;margin-top:22px}
.ecl{position:absolute;left:70%;transform:translateX(-50%);top:-17px;font:600 10.5px/14px var(--font-body);color:var(--primary);white-space:nowrap}
.tick{position:absolute;left:70%;top:-2px;width:2px;height:calc(100% + 4px);background:var(--primary);z-index:2}
.track{height:14px;border-radius:999px;background:#EAEFF5;display:flex;overflow:hidden}
.seg{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:13px;font:400 13px/18px var(--font-body);color:#334155}
.legend span.i{display:inline-flex;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}
.stage{flex:1;min-height:0;display:flex;margin-top:20px;position:relative}
.view{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
.panels{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:26px}
.panels.full{grid-template-columns:minmax(0,1fr)}
.pan-wrap{display:flex;flex-direction:column;min-height:0;min-width:0}
.pan-lbl{font:600 12px/16px var(--font-body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.pan{flex:1;min-height:0;background:var(--term);border-radius:12px;padding:15px 18px 18px;overflow-y:auto;overflow-x:hidden;position:relative}
.dots{display:flex;gap:7px;margin-bottom:15px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.term{font-family:var(--mono);font-size:12.5px;line-height:1.62;color:#E6E6EE}
.blk+.blk{margin-top:19px}
.cmd{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600;color:#F4F4F8}
.pr{color:#5BD68A;font-weight:700}
.out{white-space:pre-wrap;overflow-wrap:anywhere;color:#DCDCE6}
.tm{white-space:pre-wrap;color:#787889}
.tk{display:inline-block;min-width:5.6em}
.dsn{color:#787889;margin-bottom:4px}
.rec{display:flex;gap:12px;padding:6px 0;border-top:1px solid rgba(255,255,255,.07)}
.rec.rmark{border:1.5px solid #FF3B30;border-radius:8px;padding:6px 10px;margin:3px 0}
.rn{color:#6E6E85;min-width:2.8em;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.rj{white-space:pre-wrap;overflow-wrap:anywhere;color:#DCDCE6;flex:1}
.jk{color:#7FB3F5}
.jv{color:#C3E88D}
.jp{color:#6E6E85}
mark.emph{background:transparent;color:inherit;border:1.5px solid #FF3B30;border-radius:5px;padding:0 4px;margin:0 -1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cols{flex:1;display:grid;grid-template-columns:40% minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:28px;min-height:0}
.colL,.colR{display:flex;flex-direction:column;min-height:0;min-width:0}
.rows{flex:1;min-height:0;overflow:auto;padding-right:6px}
.sect{font:600 11.5px/16px var(--font-body);letter-spacing:.11em;text-transform:uppercase;color:var(--slate-400);margin:16px 0 9px}
.sect:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--base-100);border:1px solid var(--base-300);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font:inherit}
.row:hover{border-color:var(--slate-400)}
.row.sel{border-color:currentColor;background:var(--tint)}
.ring{width:15px;height:15px;border-radius:50%;border:2.5px solid currentColor;flex:none}
.lb{flex:1;font:500 14.5px/20px var(--font-body);color:var(--ink)}
.badge{font:600 10px/14px var(--font-body);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--tint);white-space:nowrap}
.chip{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:62px;text-align:right}
.stepper{display:flex;align-items:center;gap:12px;padding-top:16px}
.btn-reset{font:500 14px/20px var(--font-body);padding:11px 20px;border-radius:9px;border:1px solid var(--base-300);background:var(--base-100);color:var(--ink);cursor:pointer}
.btn-reset:hover{border-color:var(--slate-400)}
.btn-nav{font:600 15px/20px var(--font-body);padding:12px 22px;border-radius:9px;border:0;background:var(--primary);color:#fff;cursor:pointer}
.btn-nav:hover:not(:disabled){background:var(--primary-hover)}
.btn-nav:disabled{background:var(--base-300);color:var(--slate-400);cursor:default}
.btn-back{background:var(--base-100);color:var(--ink);border:1px solid var(--base-300)}
.btn-back:hover:not(:disabled){background:var(--base-100);border-color:var(--slate-400)}
.btn-back:disabled{background:var(--base-100);border-color:var(--base-300);color:var(--slate-400)}
.seg-tog{display:flex;gap:0;border:1px solid var(--base-300);border-radius:9px;overflow:hidden;margin-bottom:12px;width:max-content}
.seg-tog button{font:600 13px/18px var(--font-body);padding:8px 18px;border:0;background:var(--base-100);color:var(--muted);cursor:pointer}
.seg-tog button.on{background:var(--ink);color:#fff}
.trace-hd{display:flex;align-items:center;gap:12px;margin-bottom:11px;min-height:24px}
.trace-q{font:500 13px/20px var(--mono);color:var(--ink)}
.trace{flex:1;min-height:0;background:var(--nb);border-radius:12px;overflow:auto;padding:14px 0;position:relative}
.tpre{font-family:var(--mono);font-size:12px;line-height:1.5}
.tl{white-space:pre;padding:0 14px 0 13px;border-left:3px solid transparent;color:#D4D4D4}
.bnr{background:#6AA0F5;color:#12141C;font-weight:700}
.capbar{margin:20px -28px 0;background:var(--base-100);border-top:1px solid var(--base-300)}
.cap-grip{height:15px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;touch-action:none}
.cap-grip i{display:block;width:44px;height:5px;border-radius:999px;background:var(--base-300)}
.cap-grip:hover i{background:var(--slate-400)}
.capbar-in{padding:2px 28px 14px;display:flex;align-items:flex-start;justify-content:center;gap:11px;overflow-y:auto;max-height:120px}
.ico{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--slate-400);color:var(--slate-400);font:700 11px/16px var(--font-body);display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.cap{font:400 18px/1.45 var(--font-body);color:#3F4A5C;text-align:center;text-wrap:pretty}
.cap div+div{margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:44px;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--base-100);border-radius:14px;max-width:940px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(15,23,42,.32)}
.sheet-hd{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--base-300)}
.sheet-hd .t{font:600 15px/20px var(--font-body);color:var(--ink)}
.x{margin-left:auto;background:none;border:0;font:400 24px/1 var(--font-body);color:var(--muted);cursor:pointer;padding:0 4px}
.x:hover{color:var(--ink)}
.sheet-bd{background:var(--nb);overflow:auto;padding:16px 0;flex:1}
.blockx{border-left:3px solid rgba(148,163,184,.5);padding-left:10px}
.blockx .out{white-space:pre;overflow-x:auto}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div><h1>Context Window Explorer</h1></div>
    <nav class="pills"><button class="pill on" id="p-ds" data-view="ds">Data Set</button><button class="pill" id="p-vs" data-view="vs">CLI vs LLM</button><button class="pill" id="p-plus" data-view="plus">CLI + LLM</button><button class="pill" id="p-logs" data-view="logs">Logs</button></nav>
  </header>
  <section class="meter" id="meter" hidden>
    <div class="meter-hd"><span class="lbl">Context window</span><span class="meter-num"><b id="mTok">0</b> / <span id="mCtx">8K</span> &middot; <span id="mPct">0.0%</span></span></div>
    <div class="track-wrap"><div class="ecl">Effective context length</div><div class="tick"></div><div class="track" id="track"></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <main class="stage" id="stage">
    <div class="view"><div id="vbody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    <div class="stepper" id="stepper"><button class="btn-reset" data-act="reset">Reset</button><button class="btn-nav btn-back" id="bBack" data-act="back">Back</button><button class="btn-nav" id="bNext" data-act="next">Next&#xfe0e;</button></div></div>
  </main>
  <footer class="capbar" id="capbar"><div class="cap-grip" id="capGrip"><i></i></div><div class="capbar-in" id="capIn"><span class="ico">i</span><div class="cap" id="caption"></div></div></footer>
</div>
<div class="modal" id="modal" hidden><div class="sheet"><div class="sheet-hd"><span class="badge" id="mBadge"></span><span class="t" id="mTitle"></span><button class="x" id="mX" aria-label="Close">&times;</button></div><div class="sheet-bd"><div class="tpre" id="mBody"></div></div></div></div>
<!-- Context Window Explorer v1. Timestamps in the embedded dataset are synthetic (fictitious v5.2 rollout 2025-06-03T14:00Z; six affected users plus one false positive in the two days after) and match the lab dataset files, which are the source of truth. Token counts computed with tiktoken (gpt-4.1-mini encoding) from the actual prompts, commands, and tool outputs; tool outputs produced by running the real jq/grep logic against the dataset. Latencies and the $2-per-1M-token rate are illustrative. -->
<script type="application/json" id="data">{"version": "v1", "query": "Which users had problems after updating to v5.2?", "ds": {"records": [{"docid": "e8789e2b-3dbe-4c9f-a4de-2396ce4d1bb3", "text": "I accidentally deleted several project boards yesterday and thought I could restore them, but the backup option only shows data from two weeks ago. Is there a way to access a more recent snapshot or undo the deletion without losing the work my team added this week?", "from_email": "troy.pfeffer18@example.com", "timestamp": "2025-06-03T01:13:25.055Z"}, {"docid": "351c6689-2560-443e-9647-ce9787f5eaae", "text": "Since updating the mobile app yesterday, it crashes every time I try to open a shared project board, and any unsynced notes disappear. I\u2019ve also noticed push notifications are delayed by several hours, making it easy to miss time-sensitive tasks. Is there a workaround or setting I should tweak while you investigate?", "from_email": "otto_osinski17@example.com", "timestamp": "2025-06-26T18:24:54.495Z"}, {"docid": "13b7b05b-eb3f-4cd7-858f-5df0de30386f", "text": "I just realized that collaborators in my team space can view the private notes I create in my personal dashboard, even though I set them to \u201cOnly Me.\u201d Can you explain how the privacy levels actually work and what steps I need to take so only I can access those notes?", "from_email": "pearlie.langworth64@example.com", "timestamp": "2025-06-13T00:32:39.416Z"}, {"docid": "98d6cc10-f1e1-493b-aa4e-ba1cf7c29846", "text": "I\u2019m trying to export all our project boards to CSV for a quarterly audit, but every time I start the export the progress bar freezes at 12 % and eventually times out. Are there size limits or specific settings I need to change to get a complete data export without it stalling?", "from_email": "vance_ledner@example.com", "timestamp": "2025-05-11T07:21:05.941Z"}, {"docid": "996519b9-3e58-4b78-9911-b1e95de8b6e5", "text": "I upgraded to the Pro plan of TaskForge yesterday, but after exploring the features I discovered that the automations I need are still locked behind the Enterprise tier. Since I haven\u2019t used any of the Pro-exclusive exports yet, can I get a full refund and revert to the free version?", "from_email": "sage.williamson@example.com", "timestamp": "2025-05-21T14:51:14.162Z"}, {"docid": "9b76ee44-f54c-4a9c-be15-613f13ad616c", "text": "I accidentally deleted an entire project workspace, assuming I\u2019d be able to restore it from last night\u2019s automatic backup, but I can\u2019t find any restore option in the dashboard. Does your platform keep versioned backups of deleted workspaces, and if so, how can I recover everything without losing the task comments and attached files?", "from_email": "evie.miller82@example.com", "timestamp": "2025-06-17T02:18:43.850Z"}, {"docid": "d3a89504-1a3e-4c85-9465-3034050f1f30", "text": "I\u2019m trying to cancel my Pro subscription before the next billing cycle, but the dashboard only shows an option to \u201cdowngrade\u201d and still lists a charge for next month. Can you walk me through the exact steps to fully cancel and confirm that I won\u2019t be billed again?", "from_email": "remington.abshire53@example.com", "timestamp": "2025-05-25T18:46:00.988Z"}, {"docid": "d90003a6-2c39-4a6c-8af0-cfc02fc65f62", "text": "I\u2019m trying to connect your productivity dashboard to our company\u2019s OneDrive account so files sync automatically, but the integration keeps failing with a \u201ctoken expired\u201d error even after I reauthorize. Could you walk me through the correct setup or let me know if there\u2019s a known issue with the latest OneDrive API update?", "from_email": "talia78@example.com", "timestamp": "2025-06-10T14:28:09.450Z"}, {"docid": "9c69345b-f7a9-43cd-ab96-07ddf4d3821f", "text": "I tried to reset my password, but the email with the reset link never shows up in my inbox or spam folder, even after multiple attempts. Could you resend the link or help me manually reset my account so I can get back to my task boards?", "from_email": "nicholaus61@example.com", "timestamp": "2025-05-08T02:38:07.035Z"}, {"docid": "8de915a4-712c-4ad5-a5e5-bdc48ecab2e7", "text": "Does the platform let me assign recurring tasks to multiple team members and view their individual progress in a single dashboard? Also, is there a way to automatically sync those tasks with Google Calendar or Outlook, or do I have to set that up manually each time?", "from_email": "amanda_dickens@example.com", "timestamp": "2025-06-14T14:12:14.448Z"}, {"docid": "428e7d31-edd6-4395-a60b-352062c14929", "text": "I\u2019ve muted all \u201cteam activity\u201d alerts in my notification settings, yet the mobile app still pings me every time someone edits a shared project board. How can I configure it so I only get notifications for tasks I\u2019m assigned to, or is this a known bug?", "from_email": "talia78@example.com", "timestamp": "2025-05-09T01:52:19.242Z"}, {"docid": "fe54278b-52cf-41e2-94f3-94b8c69c4a42", "text": "I set up a shared workspace for my remote team, but the real-time edits aren\u2019t syncing for everyone\u2014some members see outdated versions unless they manually refresh. Is there a setting we missed or a limit on simultaneous collaborators that could be causing this lag?", "from_email": "chet58@example.com", "timestamp": "2025-05-14T17:38:24.162Z"}, {"docid": "4fe3e161-0f2c-4af6-980a-d4a0ebd40a4c", "text": "I\u2019m loving the platform, but I\u2019d really like to see a native Pomodoro timer integrated into the task view so I don\u2019t have to juggle a separate app. Is this focus-mode feature on your roadmap, or is there somewhere users can vote on it?", "from_email": "kaya51@example.com", "timestamp": "2025-05-24T12:48:49.493Z"}, {"docid": "8e1f9719-60de-4a22-9df5-51bd817c26e8", "text": "I keep getting push notifications for every tiny activity in my shared workspace even though I turned most of them off in the notification settings. Is there a way to customize alerts so I only get notified when someone tags me or assigns me a task?", "from_email": "lila_carroll38@example.com", "timestamp": "2025-05-30T09:23:55.640Z"}, {"docid": "cfedf808-b337-4e04-9866-22a8ecd9fae5", "text": "I\u2019m trying to cancel my subscription before the renewal date but the option in Account Settings just keeps looping me back to the dashboard. Can you explain the exact steps to finalize the cancellation and confirm that I won\u2019t be billed next cycle?", "from_email": "dana.harber@example.com", "timestamp": "2025-06-03T15:18:44.500Z"}, {"docid": "561f73cf-825c-407f-b95c-a0ed137567b4", "text": "I upgraded to the Pro plan yesterday, but my account still shows the Free tier and the advanced scheduling feature is locked. The payment is already listed as \u201cposted\u201d on my credit card statement\u2014can you confirm the charge and activate the subscription?", "from_email": "tad77@example.com", "timestamp": "2025-06-25T10:58:35.425Z"}, {"docid": "e927faa0-ac8a-4ecc-94f4-c9c4fbef4e46", "text": "I clicked \u201cForgot Password\u201d and got the email, but the link opens a blank page instead of the reset form. I\u2019m locked out of my account with a project deadline in a few hours\u2014can you help me get a new password?", "from_email": "sage.williamson@example.com", "timestamp": "2025-05-19T22:11:30.878Z"}, {"docid": "a1df8ee7-eb7a-4900-99bf-3a5b4c8978dd", "text": "I\u2019m currently on the monthly Starter plan, but I don\u2019t see an option to upgrade to the annual Pro tier at the prorated price\u2014only full-price billing shows up on my account page. Can you confirm whether prorated upgrading is supported and, if so, walk me through the steps?", "from_email": "kiana_fisher-price33@example.com", "timestamp": "2025-05-11T06:27:38.920Z"}, {"docid": "fa67efd4-b5dd-4589-a872-c121d60dabfb", "text": "I shared a project folder with my teammates, but they're only seeing empty placeholder files on their end, even though everything looks normal on mine. Is there a sync setting or permission I might be missing that would prevent the actual content from showing up?", "from_email": "maurine42@example.com", "timestamp": "2025-06-13T17:17:43.970Z"}, {"docid": "4b232a58-f4c2-40dc-bc1d-a2ad3bcdd6e6", "text": "I\u2019m on the free tier and want to switch our whole workspace to the Team Pro plan, but I\u2019m confused about how the billing will adjust mid-cycle. Can you explain the exact upgrade steps and confirm whether our existing projects and automations will transfer without interruption?", "from_email": "kiana_fisher-price33@example.com", "timestamp": "2025-05-16T20:12:17.589Z"}, {"docid": "7821edc6-e049-4217-80dc-0832230823e6", "text": "I thought items labeled \u201cPrivate\u201d were only visible to me, but my colleagues can see the task details in the project activity feed. How do I change the privacy settings so I can keep personal notes and drafts hidden while still collaborating on shared boards?", "from_email": "remington.abshire53@example.com", "timestamp": "2025-06-15T08:27:16.687Z"}, {"docid": "ee30eeda-592c-4c41-8138-5cdac770bfd2", "text": "I\u2019m trying to upgrade my workspace from the Team plan to the Business Plus tier so we can unlock advanced automations, but the upgrade button keeps redirecting me to a blank pricing page after I confirm payment details. Can you help me complete the upgrade without losing our existing projects and custom templates?", "from_email": "kylee67@example.com", "timestamp": "2025-06-12T12:48:31.556Z"}, {"docid": "7ddb29ff-c8ff-42ba-961c-efbdea8b1c0e", "text": "I sent invitation links to three freelancers yesterday, but none of them have received the email and the dashboard shows \u201c0 pending invites.\u201d Could the invites be stuck in some approval queue or blocked because their addresses are from a different domain?", "from_email": "brent.fritsch-shanahan61@example.com", "timestamp": "2025-05-20T18:39:28.145Z"}, {"docid": "523eb98d-6286-4479-8fe6-95bdc3bc2a9a", "text": "Every time I try to attach a screenshot to a bug report, the app freezes and the entire draft disappears. Is this a known issue, and how can I submit my reports without losing the details I\u2019ve already entered?", "from_email": "ewell_howe15@example.com", "timestamp": "2025-06-15T13:05:50.532Z"}, {"docid": "4fc66df8-9b4d-4faf-aebc-02dadfb4af67", "text": "I shared a project folder with my external vendor, but they\u2019re only seeing empty files even though the preview thumbnails look correct on my end. Is there a permission or sync setting I might be missing that would cause the actual content not to download for them?", "from_email": "jamal67@example.com", "timestamp": "2025-05-25T10:36:58.286Z"}, {"docid": "6d331eb1-7f01-4a38-ac45-83b52f58474a", "text": "After updating the TaskFlow iOS app, my projects keep showing a perpetual \u201cSyncing\u2026\u201d message and none of my new tasks appear on the web dashboard. Is there a way to force a manual sync or roll back the update without risking data loss?", "from_email": "lance.waelchi-abbott54@example.com", "timestamp": "2025-05-17T00:01:59.329Z"}, {"docid": "4f66bbd0-a687-4374-9df8-413301195396", "text": "While setting up our integration, I noticed the API documentation still lists the /tasks/v1 endpoint, but the live API returns a 404 and only recognizes /tasks/v2. Could you clarify which version is current and provide an example payload for creating a recurring task?", "from_email": "rachelle.fahey@example.com", "timestamp": "2025-05-25T21:57:26.806Z"}, {"docid": "4881b850-efd7-40d2-a07f-1e3e9630f084", "text": "I love using your platform to manage my team\u2019s tasks, but I\u2019m wondering if there are plans to add a native mind-mapping view. Having that integrated would save us from jumping between apps and keep everything linked to our projects.", "from_email": "troy.pfeffer18@example.com", "timestamp": "2025-06-18T02:28:32.831Z"}, {"docid": "0788089e-cdf0-450e-8513-5e2ada654582", "text": "I\u2019m trying to cancel m 22@example.com", "timestamp": "2025-05-19T00:43:29.519Z"}, {"docid": "29cb8e4a-2fb1-4954-85d0-18a9e19a05a5", "text": "I keep getting push notifications for completed tasks even though I disabled them in my profile settings, but emails for new comments have stopped altogether. Could you explain how the notification hierarchy works and help me configure it so I only receive mobile alerts for upcoming deadlines?", "from_email": "earl.cronin1@example.com", "timestamp": "2025-05-13T21:17:50.944Z"}, {"docid": "e5c59cbe-03bf-4824-b30f-fd09fdad85b2", "text": "I switched from Chrome to Firefox and now the task dashboard never finishes loading\u2014after the spinner disappears, the screen stays blank. Is Firefox fully supported, or is there a setting or workaround I should try to get the app working?", "from_email": "manuel94@example.com", "timestamp": "2025-05-19T06:54:04.495Z"}, {"docid": "e5d327b8-be2a-480d-8e00-68508ad9376d", "text": "I switched my workspace to \u201cprivate\u201d but colleagues can still search and preview my documents in the activity feed. What settings do I need to adjust so only people I explicitly invite can view or receive notifications about my files?", "from_email": "talia78@example.com", "timestamp": "2025-06-20T21:13:22.214Z"}, {"docid": "281e4fe7-c8cb-4d49-a34c-5460fb02af7a", "text": "I thought canceling my Premium plan would immediately end billing, but I was charged again today. Can you walk me through the exact steps to cancel and confirm there won\u2019t be any further charges on my account?", "from_email": "remington.abshire53@example.com", "timestamp": "2025-05-14T13:33:15.726Z"}, {"docid": "9a73f4d9-7e02-4c11-8b3f-7af9479c6d1b", "text": "When I open our team workspace in Firefox, the drag-and-drop task cards don\u2019t load and half the dashboard widgets overlap, but everything looks fine in Chrome. Could you confirm which browsers and versions are fully supported and whether there\u2019s a workaround to make the interface render correctly in Firefox?", "from_email": "emilio.kshlerin26@example.com", "timestamp": "2025-06-02T04:11:20.921Z"}, {"docid": "6b4168b2-3b8a-4ea6-9e37-3211ab92dd51", "text": "I upgraded to the annual Pro plan yesterday, but my card was charged twice and my workspace still shows me on the Free tier. Can you refund the extra payment and make sure my subscription status is updated?", "from_email": "hosea_abernathy90@example.com", "timestamp": "2025-05-13T13:05:36.295Z"}, {"docid": "8a5ff245-4d95-4477-a3d8-28d85f09e1f3", "text": "I was just charged for a \u201cTeam Premium\u201d subscription, but I\u2019m on an individual plan and never upgraded. Can you clarify why this charge appeared and how I can get it refunded?", "from_email": "elouise87@example.com", "timestamp": "2025-06-02T13:38:31.861Z"}, {"docid": "090836aa-a224-44c5-99a6-eecfa9942758", "text": "I\u2019ve disabled \u201cDaily Summary\u201d and \u201cUpcoming Deadlines\u201d in my notification settings, but I\u2019m still getting push alerts every morning at 8 AM. Is there another setting I need to change, or is this a bug in the latest app version?", "from_email": "randi76@example.com", "timestamp": "2025-06-27T07:52:48.175Z"}, {"docid": "94facf8c-12f5-4b0a-a788-284aafa15e94", "text": "Since the last update, my projects won\u2019t sync between the mobile app and the desktop web version, and the \u201cRefresh\u201d spinner just loops forever. I\u2019ve already tried reinstalling the app and toggling Wi-Fi/mobile data, but the task list still shows as blank while notifications keep popping up about edits I can\u2019t see.", "from_email": "triston69@example.com", "timestamp": "2025-05-09T12:54:35.320Z"}, {"docid": "d12792aa-5d50-4517-930f-90a6f9adca2e", "text": "I was charged for a Team Pro subscription this morning even though my account shows I downgraded to the free plan last week. Can you confirm the cancellation went through and refund the unexpected charge?", "from_email": "hosea_abernathy90@example.com", "timestamp utorial and manually invite my colleagues so we can start syncing tasks today?", "from_email": "christina.hickle56@example.com", "timestamp": "2025-05-21T12:54:03.056Z"}, {"docid": "f9343d3c-52d0-4b89-af86-64d5caed5f81", "text": "I created a public share link for a 500 MB project archive, but teammates keep getting an \u201cAccess Restricted\u201d notice after they download it once, even though the link is set to \u201cAnyone with the link can view.\u201d Is there a quota, time-out, or security rule that automatically revokes sharing, or am I missing a setting?", "from_email": "mckenna.keebler81@example.com", "timestamp": "2025-05-15T11:12:03.540Z"}, {"docid": "bcabc727-bc67-4e20-a55c-db805ceb47eb", "text": "I keep getting push notifications for every tiny change my teammates make, even though I thought I disabled most alerts in the project\u2019s notification settings. Can you explain which toggle controls real-time edit alerts and how to silence them without missing important task deadlines?", "from_email": "corbin_aufderhar@example.com", "timestamp": "2025-05-21T00:10:39.811Z"}, {"docid": "73056b51-17ed-47f5-9a6b-78c83a3ee1ee", "text": "Can your team dashboard import tasks from external tools like Trello or Asana, and if so, how often does it sync updates? I\u2019d also like to know whether project view settings can be customized per project or if they apply globally across the workspace.", "from_email": "lila_carroll38@example.com", "timestamp": "2025-06-26T02:03:08.796Z"}, {"docid": "7de0e5ce-7145-4938-9d05-33b9a8b23afb", "text": "My subscription renewed yesterday even though I disabled auto-renew last week, and I\u2019ve now been charged for another year. Can you confirm whether the cancellation went through and issue a refund for the unexpected payment?", "from_email": "sarina.morar70@example.com", "timestamp": "2025-05-26T12:00:38.271Z"}, {"docid": "5c642682-c11e-49d0-8811-38748ac6d999", "text": "I\u2019m currently on the Starter plan and our team is about to exceed the 1 GB file limit. If I upgrade to the Team subscription mid-month, will the charge be prorated and will all my existing integrations carry over automatically?", "from_email": "garnett.bernhard-cremin3@example.com", "timestamp": "2025-06-05T06:42:35.532Z"}, {"docid": "5c5081db-d8f8-4e42-8208-179afd600551", "text": "I\u2019m trying to share a project folder with an external contractor, but the link I generate keeps asking them to sign in even though I set the permission to \u201cAnyone with the link can view.\u201d Is there a setting I\u2019m overlooking that would let them access the files without creating an account?", "from_email": "sophia.rau59@example.com", "timestamp": "2025-06-03T04:34:11.438Z"}, {"docid": "9a609bfa-7aa3-4eeb-8399-78e5e8d170bf", "text": "I noticed that the new kanban view lets me drag tasks between columns, but I can\u2019t find an option to set WIP limits for each column the way I could in Trello. Is that feature hidden somewhere, or is it on your roadmap?", "from_email": "amir.lang8@example.com", "timestamp": "2025-05-15T20:21:59.988Z"}, {"docid": "1a5e7a2f-b864-4a0a-a86f-bf82707ce0b4", "text": "I\u2019m trying to cancel my subscription, but the \u201cManage Plan\u201d button in my account settings keeps redirecting me to a blank page. Can you walk me through the correct cancellation steps and confirm if I\u2019ll still have access to my projects until the current billing period ends?", "from_email": "timothy_flatley@example.com", "timestamp": "2025-06-21T05:17:49.128Z"}, {"docid": "e98a3e0a-dd4d-4d53-9a92-3da2d951d7a8", "text": "I\u2019m trying to cancel my subscription before the next billing cycle, but the cancellation button in my account settings keeps redirecting me to the upgrade page. Could you walk me through the correct steps or disable auto-renew on your end?", "from_email": "zakary.kilback@example.com", "timestamp": "2025-05-10T09:45:12.357Z"}, {"docid": "3dd33d6a-0b7a-4cba-bd1c-3c0751593ce7", "text": "When I export my workspace data to CSV, the file only includes the task titles and due dates, but all the comments and file attachments are missing. Is there a setting that lets me pull the full task details, or is the export tool limited to just basic fields?", "from_email": "murphy56@example.com", "timestamp": "2025-05-26T05:11:09.271Z"}, {"docid": "1b5f0586-91b5-4eae-9ea3-db22e6033810", "text": "When I try to follow the API docs for creating recurring tasks, the POST /v2/tasks endpoint returns a 400 error stating \u201crecurrence_rule not recognized,\u201d even though I\u2019m copying the JSON example exactly. Can you confirm if the parameter names have changed and point me to the latest documentation?", "from_email": "maurine42@example.com", "timestamp": "2025-06-09T16:24:09.249Z"}, {"docid": "ff49ba66-11b6-4b78-9cdf-0588fdfd6731", "text": "I\u2019d love to know if you\u2019re planning to add a kanban-style board that can sync with the current timeline view, so my team can switch perspectives without duplicating tasks. Is there a roadmap or in-app feature-request channel where we can vote or track progress on ideas like this?", "from_email": "dana.harber@example.com", "timestamp": "2025-05-28T11:15:28.013Z"}, {"docid": "900b581f-0dd3-40b9-a5d3-e4dd4a521c33", "text": "I upgraded to the Pro Annual plan last Friday, but my card was still charged the usual monthly fee this morning, so now it shows two separate charges from your platform. Could you explain why that happened and reverse the extra payment?", "from_email": "bridie_simonis62@example.com", "timestamp": "2025-05-24T00:26:25.125Z"}, {"docid": "9562002b-666c-4d6f-9361-278285561d1e", "text": "Since yesterday\u2019s update, the mobile app crashes every time I try to attach a file to a task, and any unsynced changes disappear when I reopen it. I\u2019ve already cleared the cache and reinstalled the app, but the problem keeps happening on both Wi-Fi and cellular data.", "from_email": "clyde.mann25@example.com", "timestamp": "2025-06-04T11:26:55.417Z"}, {"docid": "e60c3255-4bdb-4e84-a53e-f54a917ec3da", "text": "I\u2019m loving the platform so far, but I\u2019d really like the ability to integrate a Pomodoro timer directly into the task view. Can you tell me if there\u2019s already a roadmap for this or a public board where users can propose and vote on new features? Also, how do you decide which requests make it into the next release?", "from_email": "narciso39@example.com", "timestamp": "2025-06-22T20:41:27.432Z"}, {"docid": "7b077bf3-c3df-4799-b171-9ad00639b5b1", "text": "I tried to reset my password using the link you emailed, but every time I click it I\u2019m told the token is invalid or expired even though I requested it just minutes ago. How can I get a working reset link so I can access my projects again?", "from_email": "brent.fritsch-shanahan61@example.com", "timestamp": "2025-05-22T22:50:05.163Z"}, {"docid": "1e8af311-fa7b-4da1-b8c5-853dd568538c", "text": "Even though I\u2019ve set several project boards to \u201cPrivate,\u201d teammates can still see the card titles when they use the global search. Is there another setting I need to enable to make these boards completely invisible to everyone except me?", "from_email": "kaya51@example.com", "timestamp": "2025-06-18T04:47:14.337Z"}, {"docid": "ccb6e036-0835-43a8-834e-eb52581d7138", "text": "I recently shared a collaborative workspace with my team and noticed that everyone can see my personal task notes, which I thought were private by default. How do I adjust the privacy settings so that only I can view my individual notes while still collaborating on shared tasks?", "from_email": "maurine42@example.com", "timestamp": "2025-05-28T19:32:56.079Z"}, {"docid": "f844b4f6-5622-4c96-b2aa-96b61c313a92", "text": "I shared a project folder with my team, but they\u2019re seeing a \u201cpermission required\u201d error when they try to open any of the documents. I\u2019ve double-checked that the link is set to \u201cAnyone in the organization can edit,\u201d so is there another setting I might be missing?", "from_email": "quinten84@example.com", "timestamp": "2025-06-16T23:16:33.547Z"}, {"docid": "cf2865dc-9141-4610-b018-d6fcf1e4c1ce", "text": "I sent invitation links to three new contractors yesterday, but they\u2019re all seeing an \u201cinvalid token\u201d error when they try to sign up. Could you confirm whether there\u2019s a limit or expiry period on invitations and advise how I can resend them without losing their project access settings?", "from_email": "ewell_howe15@example.com", "timestamp": "2025-06-16T09:47:24.479Z"}, {"docid": "9d7fbaf6-746f-4669-b013-3bef3224d823", "text": "Since yesterday, the mobile app freezes every time I open my project boards, and any tasks I add vanish after I restart the app. I\u2019ve already reinstalled the app and cleared the cache, but the problem persists\u2014what else can I try?", "from_email": "vance_ledner@example.com", "timestamp": "2025-06-19T16:47:36.783Z"}, {"docid": "2bd993de-ccfd-49de-8c65-51f2d896911d", "text": "I tried upgrading to the Pro plan this morning, and your site showed an error, but my credit card was still charged twice. Could you reverse the duplicate payment and confirm when my Pro features will be activated?", "from_email": "kellen.friesen-cummings@example.com", "timestamp": "2025-05-15T22:36:48.704Z"}, {"docid": "0767943b-5f27-4a23-b7f9-cf19221be406", "text": "I accidentally cleared the \u201cDesign Sprint\u201d workspace while cleaning up old projects, and now all the attached docs and task boards are gone. Can you walk me through restoring that workspace from your backup system, and let me know how far back your automatic backups go so I can confirm nothing else is missing?", "from_email": "lilly_feest61@example.com", "timestamp": "2025-06-22T18:58:18.854Z"}, {"docid": "df192691-574d-40a1-92b4-10e40113a648", "text": "I\u2019m trying to cancel my subscription before the next billing date, but I can\u2019t find the option in the account settings. Is there a specific place to request cancellation and will I still have access to my projects until the end of the current cycle?", "from_email": "brent.fritsch-shanahan61@example.com", "timestamp": "2025-06-24T05:13:05.966Z"}, {"docid": "f64b6457-df6e-4b78-900a-021a4ecee040", "text": "The mobile app keeps crashing whenever I open a project with more than 20 tasks, and any changes I make on the phone aren\u2019t syncing to the desktop version. I\u2019ve reinstalled the app and toggled cellular/Wi-Fi, but the issue still happens every time.", "from_email": "polly72@example.com", "timestamp": "2025-06-14T14:10:02.823Z"}, {"docid": "dd15ed90-f484-4319-a143-6ba2de3c0423", "text": "I upgraded to the Pro tier during your spring promo but realized the features aren\u2019t what my team needs, so I downgraded the same day. The charge for the annual plan still went through on my credit card, and the account dashboard shows my refund request as \u201cpending\u201d for over a week. Could you confirm when the refund will be processed and whether my workspace data will remain accessible on the free plan?", "from_email": "rachelle.fahey@example.com", "timestamp": "2025-05-29T09:11:25.666Z"}, {"docid": "1b23cb91-649c-4235-a2aa-ded41bf2d5ef", "text": "I need to change the primary email on my account to my new company address, but every time I try, the platform says it\u2019s \u201calready linked to another profile\u201d even though I can\u2019t find that profile anywhere. How do I update the email without losing my task history or my premium subscription benefits?", "from_email": "kellen.friesen-cummings@example.com", "timestamp": "2025-06-18T08:24:03.112Z"}, {"docid": "6e0dac9b-3614-460d-8ccb-9a5fcef2492d", "text": "I'm trying to automate task creation from our ERP, but the API docs only show samples for the deprecated v1 endpoints. Could you point me to the updated v2 documentation and clarify the required auth headers for POST requests?", "from_email": "lila_carrol , timestamp, text}' customer_support_messages.json", "reason": "The rollout began 2025-06-03T14:00Z; keep only matching messages from the two days after it."}], "meter": {"system_messages": 224, "user_messages": 32, "tool_input": 198, "tool_output": 5024}, "caption": ["the cross-reference re-sends 5,357 tokens of context \u00b7 context growth is a number you watch, not a surprise"]}, {"kind": "tool_output", "label": "Tool output \u00b7 iteration 2", "chip": 718, "log": [{"event": "tool_output", "iteration": 2, "return_code": 0, "records": 7, "tokens": 718, "latency_s": 0.01}], "meter": {"system_messages": 224, "user_messages": 32, "tool_input": 198, "tool_output": 5742}, "caption": ["records: 7 \u00b7 six update reports and one false positive \u00b7 the password reset got through on timing alone"]}, {"kind": "final", "label": "Final answer", "chip": 86, "log": [{"event": "final_answer", "input_tokens": 6196, "output_tokens": 86, "latency_s": 2.9, "text": "Seven users reported problems after the v5.2 rollout: nicholaus61@example.com, who named v5.2 directly, plus chet58@example.com, clyde.mann25@example.com, manuel94@example.com, tierra47@example.com, erica.friesen@example.com, and garnett.bernhard-cremin3@example.com, who described problems in the two days after the rollout without naming a version."}], "meter": {"system_messages": 224, "user_messages": 32, "tool_input": 198, "tool_output": 5742}, "caption": ["the final call sends 6,196 tokens and answers in 2.9 seconds \u00b7 seven users, one of them wrong"]}, {"kind": "block", "label": "Broad run totals", "chip": "\u03a3", "block_title": "broad run totals \u00b7 computed from the log", "block_lines": ["llm calls        3", "tool commands    2", "tokens in        11,809", "tokens out       284", "model time       6.8 s", "tool time        0.02 s", "search matches   37 (negative terms)", "after time filter  7 (one false positive)"], "caption": ["totals for the broad run \u00b7 11,809 tokens in, 284 out, 6.8 seconds", "same three calls as the narrow run \u00b7 more tokens in each call, and more time \u00b7 all of it measured"]}, {"kind": "block", "label": "Narrow vs broad", "chip": "\u0394", "block_title": "narrow vs broad \u00b7 computed from the log", "block_lines": ["                    narrow      broad", "users found         1           6", "false positives     0           1", "search matches      1           37", "tokens in           993         11,809", "tokens out          151         284", "model time          3.5 s       6.8 s", "final answer        1 user      7 users"], "caption": ["side by side \u00b7 six real users instead of one \u00b7 and one false positive the model kept in the answer", "narrow favors precision \u00b7 broad favors recall \u00b7 the extra recall was paid for in tokens and time", "you can't get better, faster, and cheaper at once", "even broad terms miss plain discontent like \"what is going on?\" \u00b7 matching words, synonyms, and context is semantic search \u00b7 later in the course"]}]}}, "context_window": 8000}</script>
<script>
(function(){
var DATA=JSON.parse(document.getElementById('data').textContent);
var CTX=DATA.context_window;
var TYPE={system:{badge:'SYSTEM',color:'#CA8A04',legend:'System prompt'},user:{badge:'USER',color:'#2563EB',legend:'User prompt'},tool_input:{badge:'TOOL INPUT',color:'#DC2626',legend:'Tool input'},tool_output:{badge:'TOOL OUTPUT',color:'#9333EA',legend:'Tool output'},final:{badge:'FINAL',color:'#16A34A',legend:'Final answer'},block:{badge:'TOTALS',color:'#475569',legend:''}};
var CATS=['system_messages','user_messages','tool_input','tool_output'];
var CATC={system_messages:'#CA8A04',user_messages:'#2563EB',tool_input:'#DC2626',tool_output:'#9333EA'};
var PC={system:'#E6C07B',user:'#6AA0F5',tool_input:'#F4726E',tool_output:'#C792EA',final:'#98C379'};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function rgba(hex,a){var h=hex.replace('#','');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')'}
function tint(hex){return rgba(hex,.11)}
function commas(n){return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function plus(n){return n<1000?'+'+n:'+'+(n/1000).toFixed(2)+'K'}

/* ---------- state ---------- */
var view='ds';
var F={ds:1,vs:1};
var runSel='narrow',runF={narrow:1,broad:1},runS={narrow:-1,broad:-1};
var logsRun='narrow',logsF={narrow:1,broad:1},logsS={narrow:-1,broad:-1};

var stage=document.getElementById('stage'),meter=document.getElementById('meter');
var capEl=document.getElementById('caption');
var modal=document.getElementById('modal');

/* ---------- shared renderers ---------- */
function setCap(lines){capEl.innerHTML=(lines||['']).map(function(l){return '<div>'+esc(l)+'</div>'}).join('')}
function emphasize(text,list){
  var r=[];(list||[]).forEach(function(s){var i=text.indexOf(s);if(i>=0)r.push([i,i+s.length])});
  r.sort(function(a,b){return a[0]-b[0]});
  var out='',pos=0;
  r.forEach(function(x){if(x[0]<pos)return;out+=esc(text.slice(pos,x[0]))+'<mark class="emph">'+esc(text.slice(x[0],x[1]))+'</mark>';pos=x[1]});
  return out+esc(text.slice(pos));
}
function shellPan(label,inner){
  return '<div class="pan-wrap"><div class="pan-lbl">'+esc(label)+'</div><div class="pan"><div class="dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div><div class="term">'+inner+'</div></div></div>';
}
function blocksHtml(blocks,emph,pchar){
  pchar=pchar||'$';
  if(!blocks||!blocks.length)return '<div class="cmd"><span class="pr">'+esc(pchar)+'</span> </div>';
  return blocks.map(function(b){
    var h='<div class="cmd"><span class="pr">'+esc(pchar)+'</span> '+esc(b.command)+'</div>';
    if(b.stdout)h+='<div class="out">'+emphasize(b.stdout,emph)+'</div>';
    if(b.meta){var mm=[].concat(b.meta);h+='<div class="tm">'+mm.map(function(x){return emphasize(x,emph)}).join('\n')+'</div>'}
    if(b.time&&b.time.length)h+='<div class="tm">'+b.time.map(function(t){var p=t.split('\t');return '<span class="tk">'+esc(p[0])+'</span>'+esc(p.slice(1).join(' '))}).join('\n')+'</div>';
    return '<div class="blk">'+h+'</div>';
  }).join('');
}
function meterRender(s){
  var t=0;CATS.forEach(function(c){t+=(s&&s[c])||0});
  document.getElementById('mTok').textContent=commas(t);
  document.getElementById('mPct').textContent=(t/CTX*100).toFixed(1)+'%';
  document.getElementById('track').innerHTML=CATS.map(function(c){
    var v=(s&&s[c])||0;if(!v)return '';
    return '<div class="seg" style="width:'+Math.min(100,v/CTX*100)+'%;background:'+CATC[c]+'"></div>';
  }).join('');
}

/* ---------- trace rendering (CLI + LLM) ---------- */
var TRC={};
['narrow','broad'].forEach(function(k){
  var run=DATA.runs[k],lines=run.trace.split('\n'),msgof=[];
  run.messages.forEach(function(m){for(var i=m.trace_lines[0];i<m.trace_lines[1];i++)msgof[i]=m.id});
  TRC[k]={lines:lines,msgof:msgof};
});
function borderLine(raw,c){
  var m=raw.match(/^(\s*╭─*\s*)(.*?)(\s*─*╮\s*)$/);
  if(!m)return '<span style="color:'+c+';opacity:.7">'+esc(raw)+'</span>';
  var t=m[2],ci=t.indexOf(': '),ti;
  if(ci>=0)ti='<span style="color:'+c+';font-weight:700">'+esc(t.slice(0,ci+1))+'</span><span style="color:#C9C9C9">'+esc(t.slice(ci+1))+'</span>';
  else ti='<span style="color:'+c+';font-weight:700">'+esc(t)+'</span>';
  return '<span style="color:'+c+';opacity:.65">'+esc(m[1])+'</span>'+ti+'<span style="color:'+c+';opacity:.65">'+esc(m[3])+'</span>';
}
function bodyLine(raw,kind){
  var c=PC[kind],end=raw.charAt(raw.length-1)==='│',h=esc(raw.slice(1,end?-1:undefined));
  if(kind==='tool_input'||kind==='tool_output'){
    h=h.replace(/(^|[\s{,])"([A-Za-z_]+)"(\s*:)/g,function(a,p,k2,cl){return p+'<span style="color:'+c+';font-weight:700">"'+k2+'"</span>'+cl});
    h=h.replace(/(:\s*)(\d+)(\s*)$/,function(a,p,n,s){return p+'<span style="color:#D19A66">'+n+'</span>'+s});
  }
  var bar='<span style="color:'+c+';opacity:.65">│</span>';
  return bar+h+(end?bar:'');
}
function traceHtml(k,from,to,tagged){
  var T=TRC[k],cur=null,out='';
  for(var i=from;i<to;i++){
    var raw=T.lines[i];if(raw===undefined)continue;
    var body;
    if(raw.indexOf('╭')>=0){
      cur=/System Message/.test(raw)?'system':/User Message/.test(raw)?'user':/Tool Input:/.test(raw)?'tool_input':/Tool Output:/.test(raw)?'tool_output':'final';
      body=borderLine(raw,PC[cur]);
    }else if(raw.indexOf('╰')>=0){body='<span style="color:'+PC[cur||'system']+';opacity:.65">'+esc(raw)+'</span>';cur=null}
    else if(raw.indexOf('Agent Loop')>=0){body='<span class="bnr">'+esc(raw)+'</span>'}
    else if(cur&&raw.charAt(0)==='│'){body=bodyLine(raw,cur)}
    else body=esc(raw);
    if(!body)body='&#160;';
    out+='<div class="tl"'+(tagged?' data-m="'+(T.msgof[i]||'')+'"':'')+'>'+body+'</div>';
  }
  return out;
}

/* ---------- logs helpers ---------- */
function jobj(o){
  return '<span class="jp">{</span>'+Object.keys(o).map(function(k){
    return '<span class="jk">"'+esc(k)+'"</span><span class="jp">:</span> <span class="jv">'+esc(JSON.stringify(o[k]))+'</span>';
  }).join('<span class="jp">, </span>')+'<span class="jp">}</span>';
}
function jrec(r){
  return '<span class="jp">{</span>'+['docid','text','from_email','timestamp'].map(function(k){
    return '<span class="jk">"'+k+'"</span><span class="jp">:</span> <span class="jv">'+esc(JSON.stringify(r[k]))+'</span>';
  }).join('<span class="jp">, </span>')+'<span class="jp">}</span>';
}
function segTog(cur){
  return '<div class="seg-tog"><button data-run="narrow"'+(cur==='narrow'?' class="on"':'')+'>Narrow query</button><button data-run="broad"'+(cur==='broad'?' class="on"':'')+'>Broad query</button></div>';
}

/* ---------- frame bookkeeping ---------- */
function frameMax(){
  if(view==='ds')return 1;
  if(view==='vs')return DATA.vs.frames.length;
  if(view==='plus')return DATA.runs[runSel].messages.length;
  return DATA.logs[logsRun].entries.length;
}
function curFrame(){return view==='plus'?runF[runSel]:view==='logs'?logsF[logsRun]:F[view]}
function setFrame(n){if(view==='plus')runF[runSel]=n;else if(view==='logs')logsF[logsRun]=n;else F[view]=n}

/* ---------- view renderers ---------- */
function renderDS(){
  var recs=DATA.ds.records,marked={};(DATA.ds.marked||[]).forEach(function(d){marked[d]=1});
  var inner='<div class="blk"><div class="cmd"><span class="pr">$</span> jq length customer_support_messages.json</div><div class="out">'+recs.length+'</div></div>'
    +'<div class="blk"><div class="cmd"><span class="pr">$</span> jq -c \'.[]\' customer_support_messages.json</div>'
    +recs.map(function(r,i){return '<div class="rec'+(marked[r.docid]?' rmark':'')+'"><span class="rn">'+(i+1)+'</span><span class="rj">'+jrec(r)+'</span></div>'}).join('')+'</div>';
  stage.querySelector('#vbody').innerHTML='<div class="panels full">'+shellPan('DATASET · customer_support_messages.json',inner)+'</div>';
  setCap(DATA.ds.caption);
}
function renderVS(){
  var f=DATA.vs.frames[F.vs-1];
  stage.querySelector('#vbody').innerHTML='<div class="panels">'
    +shellPan(f.model_label||DATA.vs.model_label,blocksHtml(f.model,f.emph,'>'))
    +shellPan(DATA.vs.shell_label,blocksHtml(f.shell,f.emph))+'</div>';
  setCap(f.caption);
}
function renderPlusRows(){
  var run=DATA.runs[runSel],n=runF[runSel],sel=runS[runSel];
  var h='',last='';
  for(var i=0;i<n;i++){
    var m=run.messages[i],t=TYPE[m.type];
    var it=-1;run.iterations.forEach(function(r,k2){if(m.trace_lines[0]>=r[0]&&m.trace_lines[0]<r[1])it=k2});
    var sect=it<0?'Task setup':(it===run.iterations.length-1?'Final':'Iteration '+(it+1));
    if(sect!==last){h+='<div class="sect">'+esc(sect)+'</div>';last=sect}
    h+='<button class="row'+(i===sel?' sel':'')+'" data-i="'+i+'" style="color:'+t.color+';--tint:'+tint(t.color)+'"><span class="ring"></span><span class="lb">'+esc(m.label)+'</span><span class="badge">'+t.badge+'</span></button>';
  }
  return h;
}
function renderPlus(){
  var run=DATA.runs[runSel],n=runF[runSel];
  stage.querySelector('#vbody').innerHTML='<div class="cols"><div class="colL">'+segTog(runSel)+'<div class="rows" id="rows"></div></div>'
    +'<div class="colR"><div class="trace-hd"><span class="lbl">Agent trace</span><span class="trace-q">'+esc(run.query)+'</span></div><div class="trace" id="trace"><div class="tpre" id="tpre"></div></div></div></div>';
  document.getElementById('rows').innerHTML=renderPlusRows();
  document.getElementById('tpre').innerHTML=traceHtml(runSel,0,TRC[runSel].lines.length,true);
  meterRender(run.snaps[n-1]);
  setCap(run.caps[n-1]);
  highlightPlus(false);
}
function highlightPlus(scroll){
  var run=DATA.runs[runSel],sel=runS[runSel];
  var tpre=document.getElementById('tpre'),trace=document.getElementById('trace');
  if(!tpre)return;
  [].slice.call(tpre.querySelectorAll('.tl')).forEach(function(e){e.style.borderLeftColor='';e.style.background=''});
  if(sel<0)return;
  var m=run.messages[sel],c2=TYPE[m.type].color;
  var hi=[].slice.call(tpre.querySelectorAll('[data-m="'+m.id+'"]'));
  hi.forEach(function(e){e.style.borderLeftColor=c2;e.style.background=rgba(c2,.10)});
  if(hi.length&&scroll)trace.scrollTo({top:Math.max(0,hi[0].offsetTop-10),behavior:'smooth'});
}
function renderLogs(){
  var E=DATA.logs[logsRun].entries,n=logsF[logsRun],sel=logsS[logsRun];
  var h='';
  for(var i=0;i<n;i++){
    var en=E[i],t=TYPE[en.kind]||TYPE.block;
    var chip=en.kind==='block'?esc(en.chip):plus(en.chip);
    h+='<button class="row'+(i===sel?' sel':'')+'" data-i="'+i+'" style="color:'+t.color+';--tint:'+tint(t.color)+'"><span class="ring"></span><span class="lb">'+esc(en.label)+'</span><span class="badge">'+t.badge+'</span><span class="chip">'+chip+'</span></button>';
  }
  var lg='<div class="dsn">'+esc(DATA.logs.file_label)+'</div>',ln=0;
  for(var j=0;j<n;j++){
    var e2=E[j],c3=(TYPE[e2.kind]||TYPE.block).color;
    if(e2.kind==='block'){
      lg+='<div class="blk blockx" data-e="'+j+'" style="border-left-color:'+rgba(c3,.5)+(j===sel?';background:'+rgba(c3,.12):'')+'"><div class="dsn">'+esc(e2.block_title)+'</div><div class="out">'+e2.block_lines.map(esc).join('\n')+'</div></div>';
    }else{
      (e2.log||[]).forEach(function(o){
        ln++;
        lg+='<div class="rec" data-e="'+j+'" style="'+(j===sel?'background:'+rgba(c3,.12):'')+'"><span class="rn">'+ln+'</span><span class="rj">'+jobj(o)+'</span></div>';
      });
    }
  }
  stage.querySelector('#vbody').innerHTML='<div class="cols"><div class="colL">'+segTog(logsRun)+'<div class="rows" id="rows">'+h+'</div></div>'
    +'<div class="colR"><div class="trace-hd"><span class="lbl">Harness log</span><span class="trace-q">'+esc(DATA.runs[logsRun].query)+'</span></div><div class="pan" id="logPan"><div class="dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div><div class="term">'+lg+'</div></div></div></div>';
  var s={};for(var q=0;q<n;q++)if(E[q].meter)s=E[q].meter;
  meterRender(s);
  setCap(E[n-1].caption);
}

/* ---------- devbadge / stepper / dispatch ---------- */
function devCode(){
  var f=curFrame();
  if(view==='ds')return 'DS-'+f;
  if(view==='vs')return 'VS-'+f;
  if(view==='plus')return (runSel==='narrow'?'NQ-':'BQ-')+f;
  return (logsRun==='narrow'?'LN-':'LB-')+f;
}
function render(){
  meter.hidden=(view!=='plus');
  document.getElementById('stepper').hidden=(view==='ds');
  if(view==='ds')renderDS();else if(view==='vs')renderVS();else if(view==='plus')renderPlus();else renderLogs();
  var mx=frameMax(),f=curFrame();
  document.getElementById('bBack').disabled=f<=1;
  document.getElementById('bNext').disabled=f>=mx;
  ['ds','vs','plus','logs'].forEach(function(v){document.getElementById('p-'+v).className='pill'+(v===view?' on':'')});
  var db=document.getElementById('devbadge');if(db)db.textContent=DATA.version+' · '+devCode();
  var selRow=document.querySelector('#rows .row.sel');if(selRow)selRow.scrollIntoView({block:'nearest'});
}
function nav(d){
  var mx=frameMax(),f=curFrame()+d;
  if(f<1||f>mx)return;
  setFrame(f);
  if(view==='plus')runS[runSel]=f-1;
  if(view==='logs')logsS[logsRun]=f-1;
  render();
  if(view==='plus')highlightPlus(true);
  if(view==='logs')scrollLogsTo(f-1);
}
function scrollLogsTo(i){
  var pan=document.getElementById('logPan');if(!pan)return;
  var el=pan.querySelector('[data-e="'+i+'"]');
  if(el)pan.scrollTo({top:Math.max(0,el.offsetTop-60),behavior:'smooth'});
}
function resetView(){
  setFrame(1);
  if(view==='plus')runS[runSel]=-1;
  if(view==='logs')logsS[logsRun]=-1;
  render();
}

/* ---------- modal ---------- */
function openModal(badge,color,title,bodyHtml){
  document.getElementById('mBadge').textContent=badge;
  document.getElementById('mBadge').style.cssText='color:'+color+';--tint:'+tint(color);
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=bodyHtml;
  modal.hidden=false;
}
function rowClick(i){
  if(view==='plus'){
    runS[runSel]=i;render();highlightPlus(true);
    var m=DATA.runs[runSel].messages[i];
    openModal(TYPE[m.type].badge,TYPE[m.type].color,m.label,traceHtml(runSel,m.trace_lines[0],m.trace_lines[1],false));
  }else if(view==='logs'){
    logsS[logsRun]=i;render();scrollLogsTo(i);
    var en=DATA.logs[logsRun].entries[i],t=TYPE[en.kind]||TYPE.block,body;
    if(en.kind==='block')body=[en.block_title,''].concat(en.block_lines).map(function(l){return '<div class="tl">'+(esc(l)||'&#160;')+'</div>'}).join('');
    else body=(en.log||[]).map(function(o){return JSON.stringify(o,null,2)}).join('\n\n').split('\n').map(function(l){return '<div class="tl">'+(esc(l)||'&#160;')+'</div>'}).join('');
    openModal(t.badge,t.color,en.label,body);
  }
}

/* ---------- talking-points drag handle ---------- */
var capGrip=document.getElementById('capGrip'),capIn=document.getElementById('capIn');
var capH=120,dragOn=false,dragY=0,dragH=0;
function applyCap(){capIn.style.maxHeight=capH+'px';capIn.style.visibility=capH<10?'hidden':'visible'}
capGrip.addEventListener('pointerdown',function(e){dragOn=true;dragY=e.clientY;dragH=capH;capGrip.setPointerCapture(e.pointerId);e.preventDefault()});
capGrip.addEventListener('pointermove',function(e){if(!dragOn)return;capH=Math.max(0,Math.min(160,dragH-(e.clientY-dragY)));applyCap()});
capGrip.addEventListener('pointerup',function(){dragOn=false});
applyCap();

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var p=e.target.closest('.pill');if(p){view=p.dataset.view;render();return}
  var tg=e.target.closest('[data-run]');if(tg){if(view==='logs')logsRun=tg.dataset.run;else runSel=tg.dataset.run;render();return}
  var a=e.target.closest('[data-act]');
  if(a){if(a.dataset.act==='next')nav(1);else if(a.dataset.act==='back')nav(-1);else if(a.dataset.act==='reset')resetView();return}
  var r=e.target.closest('.row');if(r){rowClick(+r.dataset.i);return}
  if(e.target===modal||e.target.id==='mX')modal.hidden=true;
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){modal.hidden=true;return}
  if(modal.hidden&&e.key==='ArrowRight')nav(1);
  if(modal.hidden&&e.key==='ArrowLeft')nav(-1);
});

document.getElementById('mCtx').textContent=Math.round(CTX/1000)+'K';
document.getElementById('legend').innerHTML=['system','user','tool_input','tool_output','final'].map(function(k){
  return '<span class="i"><span class="dot" style="background:'+TYPE[k].color+'"></span>'+TYPE[k].legend+'</span>';
}).join('');
render();
})();
</script>
</body>
</html>
